name: Build SukiADB MiuiX APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: 拉取 Axeron-API 子模块
        run: |
          rm -rf api
          git clone https://github.com/fahrez182/Axeron-API.git api
          git -C api checkout 37eb6a3521828458394797e7166ff2e90946304e
          echo "--- api 内容 ---"
          ls -A api | head -20

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # runner 镜像自带 Android SDK，不用 setup-android action
      # （它会在 sdkmanager --licenses 卡死：Node20 被强制跑在 Node24 上）
      - name: 定位 Android SDK
        run: |
          SDK=""
          for d in /usr/local/lib/android/sdk "$ANDROID_HOME" "$ANDROID_SDK_ROOT"; do
            [ -d "$d" ] && SDK="$d" && break
          done
          if [ -z "$SDK" ]; then
            echo "::error::找不到预装 SDK"
            exit 1
          fi
          echo "SDK=$SDK"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "$SDK/platform-tools" >> $GITHUB_PATH
          SDKM=$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -1)
          echo "sdkmanager=$SDKM"
          echo "SDKM=$SDKM" >> $GITHUB_ENV
          "$SDKM" --version

      - name: 接受许可
        run: |
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          echo "licenses done"

      - name: 安装 SDK 组件与 NDK
        run: |
          for pkg in "platforms;android-37" "build-tools;37.0.0" "ndk;29.0.14206865" "cmake;3.22.1"; do
            echo "=== 安装 $pkg ==="
            "$SDKM" --install "$pkg" 2>&1 | tail -3 || echo "!! $pkg 安装失败，继续"
          done
          echo "--- 已安装 ---"
          ls "$ANDROID_HOME/ndk" 2>/dev/null || echo "无 ndk 目录"

      - name: 生成签名密钥
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/release.keystore" \
            -alias sukiadb \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass sukiadb -keypass sukiadb \
            -dname "CN=SukiADB, O=Local, C=CN"

      - name: 写入 local.properties
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          api_version_code=30000
          api_version_name=3.0.0
          signing.storeFile=$GITHUB_WORKSPACE/release.keystore
          signing.storePassword=sukiadb
          signing.keyAlias=sukiadb
          signing.keyPassword=sukiadb
          EOF
          cat local.properties

      - name: 开始编译
        run: |
          chmod +x gradlew
          ./gradlew :manager:assembleRelease --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SukiADB-MiuiX-APK
          path: manager/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30
